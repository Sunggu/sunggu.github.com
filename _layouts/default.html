<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

{%- include head.html -%}

<body class="container">

    <a class="skip-main" href="#content">Skip to main content</a>
    <div id="top" class="page" role="document">
    {%- include header.html -%}

    <main aria-label="Content">
        <div id="content">
            {{ content }}
        </div>
    </main>

    {%- include footer.html -%}
    </div>
    {%- if site.theme_switcher -%}
    <script src="{{ '/assets/switcher.js' | relative_url }}" type="text/javascript"></script>
    {%- endif -%}
    
    <!-- Simple-Jekyll-Search Library & Initialization -->
    <script src="https://unpkg.com/simple-jekyll-search@latest/dest/simple-jekyll-search.min.js"></script>
    <script>
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        json: '{{ "/search.json" | relative_url }}',
        searchResultTemplate: '<li><a href="{url}">{title}</a><span class="search-result-date">{date}</span></li>',
        noResultsText: '<li class="no-result">No results found</li>',
        limit: 10,
        fuzzy: false
      });

      // Search toggle logic
      (function() {
        var searchToggle = document.getElementById('search-toggle');
        var searchContainer = document.getElementById('search-container');
        var searchInput = document.getElementById('search-input');
        var searchClose = document.getElementById('search-close');

        if (searchToggle && searchContainer && searchInput) {
          searchToggle.addEventListener('click', function(e) {
            e.preventDefault();
            searchContainer.classList.toggle('active');
            if (searchContainer.classList.contains('active')) {
              searchInput.focus();
            }
          });
        }

        if (searchClose && searchContainer) {
          searchClose.addEventListener('click', function(e) {
            e.preventDefault();
            searchContainer.classList.remove('active');
          });
        }

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && searchContainer && searchContainer.classList.contains('active')) {
            searchContainer.classList.remove('active');
          }
        });
      })();
    </script>
</body>

</html>
