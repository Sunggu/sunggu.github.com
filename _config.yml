# Welcome to Jekyll!
#
# Site settings
title: Binarygap Log
email: yuseungku@gmail.com
description: "Bridging the gap one step at a time — Colin's personal space for deep research, blueprints, and steady growth."
tagline: "Bridging the gap step by step"
baseurl: ""
url: "https://binarygap.com"
repository: Sunggu/sunggu.github.com
github: Sunggu
lang: en

# SEO & Analytics
google_site_verification: "" # Google Search Console verification code
naver_site_verification: ""  # Naver Webmaster Tools verification code
google_analytics:

comments: false

author: Colin
author_bio: "Hey there! I'm Colin. I love tinkering with ideas, diving down research rabbit holes, and turning bold ideas into clear blueprints."
author_pic: ""

paginate: 5
paginate_path: "/:num/"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
permalink: /:title

theme_switcher: false

# Allows all pages to be put into `_pages` folder
# for easier navigation and better SEO.
collections:
  pages:
    output: true
    permalink: /:title

# Exclude from processing.
exclude:
  - ".jekyll-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "theme"
  - "sandbox"
  - "posts"
