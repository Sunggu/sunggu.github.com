# Welcome to Jekyll!
#
# Site settings
title: Binarygap Log
email: yuseungku@gmail.com
description: "Discover stories. Ideas, experiences, and discoveries from around the world."
tagline: "Discover stories. Ideas, experiences, and discoveries from around the world."
baseurl: ""
url: "https://blog.binarygap.com"
repository: Sunggu/sunggu.github.com
github: Sunggu
lang: en

# SEO & Analytics
google_site_verification: "" # Google Search Console verification code
naver_site_verification: ""  # Naver Webmaster Tools verification code
google_analytics: "G-XYMZ7XMCDQ"

comments: false

author: "Binarygap"
author_bio: "Binarygap Log shares ideas, experiences, and discoveries from around the world — turning curiosity into clear blueprints and meaningful stories."
author_pic: ""

paginate: 5
paginate_path: "/:num/"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
permalink: /:title

theme_switcher: false

# Allows all pages to be put into `_pages` folder
# for easier navigation and better SEO.
collections:
  pages:
    output: true
    permalink: /:title

# Exclude from processing.
exclude:
  - ".jekyll-cache"
  - "Gemfile"
  - "Gemfile.lock"
  - "theme"
  - "sandbox"
